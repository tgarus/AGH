# Production deployment skeleton for ASI Control Plane & PostgreSQL.
# Workers (asi-worker) run natively on isolated network vantage points via deploy/systemd/asi-worker.service
# and communicate solely with asi-api over HTTPS/TLS (/internal/v1/worker/*).
#
# Production prerequisites:
# 1. Mount /var/lib/asi-luks/pgdata onto a LUKS2-encrypted host volume.
# 2. Terminate TLS at Caddy / Nginx / HAProxy in front of 127.0.0.1:8080 and 127.0.0.1:8081.
# 3. Set strong ASI_JWT_SECRET, ASI_MASTER_KEY (64 hex chars), ASI_BOOTSTRAP_ADMIN_PASSWORD, and ASI_COOKIE_SECURE=true in .env.

services:
  asi-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /var/lib/asi-luks/pgdata:/var/lib/postgresql/data
    networks:
      - asi-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  asi-api:
    image: ghcr.io/agh-cbi/asi-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      asi-db:
        condition: service_healthy
    env_file:
      - ../.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - asi-internal
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  asi-ui:
    image: ghcr.io/agh-cbi/asi-ui:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    restart: unless-stopped
    depends_on:
      asi-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - asi-internal
    ports:
      - "127.0.0.1:8081:80"

networks:
  asi-internal:
    driver: bridge
